name: driver-spline-python-tests

on:
  pull_request:
    paths:
      - "tools/driver_spline/**"
      - ".github/workflows/driver-spline-python-tests.yml"
  push:
    branches:
      - "test/driver-spline-python"
    paths:
      - "tools/driver_spline/**"
      - ".github/workflows/driver-spline-python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run unit and mocked-PyMXS tests
        working-directory: tools/driver_spline
        run: python -m pytest -q
