name: Build Camera-Specific 3ds Max 2026 VP Isolate

on:
  workflow_dispatch:
  push:
    paths:
      - "CameraViewportIsolate.cpp"
      - "Camera_Viewport_Isolate.py"
      - "Launch_Camera_Viewport_Isolate.ms"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore 3ds Max 2026 SDK installer cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\SDK_3dsMax2026.msi
          key: 3dsmax-2026-sdk-msi-v1

      - name: Download Autodesk 3ds Max 2026 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Max/Autodesk+3ds+Max+2026/SDK_3dsMax2026.msi"
          $msi = Join-Path $env:RUNNER_TEMP "SDK_3dsMax2026.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          if (!(Test-Path $msi)) { throw "SDK download failed." }

      - name: Save SDK installer cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\SDK_3dsMax2026.msi
          key: 3dsmax-2026-sdk-msi-v1

      - name: Verify SDK installer
        shell: powershell
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "SDK_3dsMax2026.msi"
          if (!(Test-Path $msi)) { throw "SDK installer is missing." }

      - name: Install SDK on temporary GitHub runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:RUNNER_TEMP "SDK_3dsMax2026.msi"
          $p = Start-Process msiexec.exe -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart"
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Autodesk SDK installer returned exit code $($p.ExitCode)"
          }

      - name: Find SDK
        id: sdk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $roots = @(
            "C:\Program Files\Autodesk\3ds Max 2026 SDK\maxsdk",
            "C:\Program Files\Autodesk\3ds Max 2026 SDK"
          )
          $sdk = $null
          foreach ($root in $roots) {
            if (Test-Path (Join-Path $root "include\max.h")) {
              $sdk = $root
              break
            }
          }
          if (-not $sdk) { throw "max.h was not found after SDK installation." }
          "sdk_root=$sdk" >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DMAXSDK_ROOT="${{ steps.sdk.outputs.sdk_root }}"

      - name: Build Release DLL
        shell: powershell
        run: |
          cmake --build build --config Release --verbose

      - name: Verify DLL
        shell: powershell
        run: |
          $dll = "build\Release\CameraViewportIsolate.dll"
          if (!(Test-Path $dll)) { throw "CameraViewportIsolate.dll was not created." }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Package ready-to-use files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ReadyToUse | Out-Null
          Copy-Item "build\Release\CameraViewportIsolate.dll" "ReadyToUse\"
          Copy-Item "Camera_Viewport_Isolate.py" "ReadyToUse\"
          Copy-Item "Launch_Camera_Viewport_Isolate.ms" "ReadyToUse\"

          @"
          CAMERA-SPECIFIC VIEWPORT ISOLATE — 3ds Max 2026
          =================================================

          No administrator rights required.

          1. Extract these files to a writable folder.
          2. In 3ds Max: Scripting > Run Script.
          3. Run Launch_Camera_Viewport_Isolate.ms.
          4. Activate Camera A viewport and click SET THIS CAMERA.
          5. Select objects and click ISOLATE SELECTED IN THIS CAMERA.

          Camera A: selected objects only.
          Camera B / other cameras: full scene.

          Renderable / Hide / Freeze / Layer visibility are never modified.
          "@ | Set-Content "ReadyToUse\README.txt"

      - name: Upload ready-to-use package
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Specific-VP-Isolate-3dsMax2026-READY
          path: ReadyToUse
          if-no-files-found: error
