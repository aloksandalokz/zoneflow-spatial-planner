name: Build and Test Camera Filter - 3ds Max 2026

on:
  workflow_dispatch:
  push:
    paths:
      - "CameraPerViewportFilter.cpp"
      - "CameraPerViewportFilterLogic.h"
      - "CameraPerViewportFilterTests.cpp"
      - "Camera_Filter_Isolate.py"
      - "Launch_Camera_Filter_Isolate.ms"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"

jobs:
  build-test-package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore 3ds Max 2026 SDK installer cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\SDK_3dsMax2026.msi
          key: 3dsmax-2026-sdk-msi-v1

      - name: Download Autodesk 3ds Max 2026 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Max/Autodesk+3ds+Max+2026/SDK_3dsMax2026.msi"
          $msi = Join-Path $env:RUNNER_TEMP "SDK_3dsMax2026.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          if (!(Test-Path $msi)) { throw "SDK download failed." }

      - name: Save SDK installer cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\SDK_3dsMax2026.msi
          key: 3dsmax-2026-sdk-msi-v1

      - name: Install SDK on temporary GitHub runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Join-Path $env:RUNNER_TEMP "SDK_3dsMax2026.msi"
          if (!(Test-Path $msi)) { throw "SDK installer is missing." }
          $p = Start-Process msiexec.exe -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart"
          ) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Autodesk SDK installer returned exit code $($p.ExitCode)"
          }

      - name: Find SDK
        id: sdk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $roots = @(
            "C:\Program Files\Autodesk\3ds Max 2026 SDK\maxsdk",
            "C:\Program Files\Autodesk\3ds Max 2026 SDK"
          )
          $sdk = $null
          foreach ($root in $roots) {
            if (Test-Path (Join-Path $root "include\max.h")) {
              $sdk = $root
              break
            }
          }
          if (-not $sdk) { throw "max.h was not found after SDK installation." }
          Write-Host "SDK=$sdk"
          "sdk_root=$sdk" >> $env:GITHUB_OUTPUT

      - name: Configure CMake against actual 2026 SDK
        shell: powershell
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DMAXSDK_ROOT="${{ steps.sdk.outputs.sdk_root }}"

      - name: Build DLL and unit-test executable
        shell: powershell
        run: |
          cmake --build build --config Release --verbose

      - name: Run camera-filter logic tests
        shell: powershell
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify DLL and exported functions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dll = "build\Release\CameraPerViewportFilter.dll"
          if (!(Test-Path $dll)) { throw "CameraPerViewportFilter.dll was not created." }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found." }
          $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsroot) { throw "Visual Studio C++ installation not found." }

          $dumpbinFile = Get-ChildItem (Join-Path $vsroot "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1
          if (-not $dumpbinFile) { throw "dumpbin.exe not found in Visual Studio installation." }

          Write-Host "Using dumpbin: $($dumpbinFile.FullName)"
          $dump = & $dumpbinFile.FullName /exports $dll | Out-String
          $required = @(
            "CameraFilter_Isolate",
            "CameraFilter_Restore",
            "CameraFilter_Shutdown",
            "CameraFilter_SelfTest",
            "CameraFilter_PreCalls",
            "CameraFilter_FilterCalls",
            "CameraFilter_HiddenDecisions"
          )
          foreach ($name in $required) {
            if ($dump -notmatch [regex]::Escape($name)) {
              throw "Missing DLL export: $name"
            }
          }
          Write-Host "All required exports verified."

      - name: Python syntax check
        shell: powershell
        run: |
          python -m py_compile Camera_Filter_Isolate.py

      - name: Package only after all tests pass
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ReadyToUse | Out-Null
          Copy-Item "build\Release\CameraPerViewportFilter.dll" "ReadyToUse\"
          Copy-Item "Camera_Filter_Isolate.py" "ReadyToUse\"
          Copy-Item "Launch_Camera_Filter_Isolate.ms" "ReadyToUse\"

          @"
          CAMERA FILTER - 3ds Max 2026
          ============================

          CI status before packaging:
          - Compiled against Autodesk 3ds Max 2026 SDK
          - Camera A / Camera B predicate tests passed
          - DLL exports verified
          - Python syntax check passed

          IMPORTANT:
          GitHub CI does not contain a licensed 3ds Max application, so it cannot
          visually open a Nitrous viewport. The DLL performs an additional native
          self-test when the palette opens.

          Usage:
          1. Fully close 3ds Max before replacing previous experimental DLLs.
          2. Extract these files to a new folder.
          3. Open 3ds Max 2026.
          4. Scripting > Run Script > Launch_Camera_Filter_Isolate.ms
          5. Click Camera A viewport > SET THIS CAMERA.
          6. Select the objects to KEEP visible.
          7. KEEP ONLY SELECTED IN THIS CAMERA.

          Other camera viewports should remain full scene.
          Renderable / layers / object hidden flags are not modified.
          "@ | Set-Content "ReadyToUse\README.txt"

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Filter-3dsMax2026-TESTED
          path: ReadyToUse
          if-no-files-found: error
